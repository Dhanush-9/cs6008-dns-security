services:
    client:
        image: cs6008-phase1-lab
        cap_add:
            - NET_ADMIN
        sysctls:
            net.ipv4.ip_forward: "0"
        networks:
            client-net:
                ipv4_address: 172.16.1.10

    webserver:
        image: cs6008-phase1-lab
        cap_add:
            - NET_ADMIN
        sysctls:
            net.ipv4.ip_forward: "0"
        networks:
            client-net:
                ipv4_address: 172.16.1.20

    edge-router:
        image: cs6008-phase1-lab
        cap_add:
            - NET_ADMIN
        sysctls:
            net.ipv4.ip_forward: "1"
        networks:
            client-net:
                ipv4_address: 172.16.1.2
            resolver-net:
                ipv4_address: 172.16.2.2

    resolver:
        image: cs6008-phase1-lab
        cap_add:
            - NET_ADMIN
        sysctls:
            net.ipv4.ip_forward: "0"
        networks:
            resolver-net:
                ipv4_address: 172.16.2.10

    core-router:
        image: cs6008-phase1-lab
        cap_add:
            - NET_ADMIN
        sysctls:
            net.ipv4.ip_forward: "1"
        networks:
            resolver-net:
                ipv4_address: 172.16.2.3
            authoritative-net:
                ipv4_address: 172.16.3.3
            
    root-ns:
        image: cs6008-phase1-lab
        cap_add:
            - NET_ADMIN
        sysctls:
            net.ipv4.ip_forward: "0"
        networks:
            authoritative-net:
                ipv4_address: 172.16.3.10

    tld-ns:
        image: cs6008-phase1-lab
        cap_add:
            - NET_ADMIN
        sysctls:
            net.ipv4.ip_forward: "0"
        networks:
            authoritative-net:
                ipv4_address: 172.16.3.20

    domain-ns:
        image: cs6008-phase1-lab
        cap_add:
            - NET_ADMIN
        sysctls:
            net.ipv4.ip_forward: "0"
        networks:
            authoritative-net:
                ipv4_address: 172.16.3.30

networks:
    client-net:
        driver: bridge
        internal: true
        ipam:
            config:
                - subnet: 172.16.1.0/24

    resolver-net:
        driver: bridge
        internal: true
        ipam:
            config:
                - subnet: 172.16.2.0/24

    authoritative-net:
        driver: bridge
        internal: true
        ipam:
            config:
                - subnet: 172.16.3.0/24