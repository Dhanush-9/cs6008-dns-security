options {
    directory "/var/cache/bind";

    listen-on port 53 {
        172.16.2.10;
    };

    listen-on-v6 { none; };

    recursion yes;

    allow-query {
        172.16.1.0/24;
        172.16.2.0/24;
    };

    allow-recursion {
        172.16.1.0/24;
        172.16.2.0/24;
    };

    dnssec-validation no;
};

zone "." {
    type hint;
    file "/etc/bind/root.hints";
};