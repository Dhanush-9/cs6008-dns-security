options {
    directory "/var/cache/bind";

    listen-on port 53 {
        172.16.2.10;
    };

    listen-on-v6 { none; };

    recursion yes;

    allow-query {
        172.16.1.0/24;
        172.16.2.0/24;
    };

    allow-recursion {
        172.16.1.0/24;
        172.16.2.0/24;
    };

    // DNSSEC validation stays ON, exactly as in Phase 3. The resolver still
    // cryptographically validates every answer it fetches from upstream. Phase 6
    // does not weaken the resolver at all -- the attack happens AFTER this, on
    // the resolver-to-client hop.
    dnssec-validation yes;
};

include "/etc/bind/trust-anchors.conf";

zone "." {
    type hint;
    file "/etc/bind/root.hints";
};
