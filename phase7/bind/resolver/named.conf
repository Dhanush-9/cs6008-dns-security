// Phase 7: DoT-capable resolver
// Kept identical to Phase 6 except for the TLS listener.

tls local-tls {
    cert-file "/etc/bind-tls/resolver.crt";
    key-file  "/etc/bind-tls/resolver.key";
};

options {
    directory "/var/cache/bind";

    // Plain DNS – kept open so the cleartext-fallback client (Client 2) and the
    // attacker's forged UDP answers in Attempt (iii) still work.
    listen-on port 53 {
        172.16.2.10;
    };

    // DoT – the encrypted, authenticated transport tested in Phase 7.
    listen-on port 853 tls local-tls {
        172.16.2.10;
    };

    listen-on-v6 { none; };

    recursion yes;

    allow-query {
        172.16.1.0/24;
        172.16.2.0/24;
    };

    allow-recursion {
        172.16.1.0/24;
        172.16.2.0/24;
    };

    // DNSSEC validation – must remain enabled. Phase 7 protects the last-mile
    // hop; upstream validation is still required.
    dnssec-validation yes;
};

include "/etc/bind/trust-anchors.conf";

zone "." {
    type hint;
    file "/etc/bind/root.hints";
};
