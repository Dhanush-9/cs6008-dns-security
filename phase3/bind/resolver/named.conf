options {
    directory "/var/cache/bind";

    listen-on port 53 {
        172.16.2.10;
    };

    listen-on-v6 { none; };

    recursion yes;

    allow-query {
        172.16.1.0/24;
        172.16.2.0/24;
    };

    allow-recursion {
        172.16.1.0/24;
        172.16.2.0/24;
    };

    dnssec-validation yes;
};

include "/etc/bind/rndc.key";
include "/etc/bind/trust-anchors.conf";

controls {
    inet 127.0.0.1 port 953
    allow { 127.0.0.1; } keys { "rndc-key"; };
};

zone "." {
    type hint;
    file "/etc/bind/root.hints";
};